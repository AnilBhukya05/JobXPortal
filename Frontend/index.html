<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PRIMARY META -->
    <title>JobXPortal — Live Job Search Across All Portals</title>
    <meta name="description" content="Search jobs from LinkedIn, Naukri, Glassdoor, Indeed and more in one place. AI Resume Match, Interview Prep, Cover Letter Generator — all free." />
    <meta name="keywords" content="jobs, job search, fresher jobs, IT jobs, India jobs, naukri, linkedin jobs, work from home" />
    <meta name="author" content="Anil Bhukya" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10B981" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- APPLE PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JobXPortal" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- OPEN GRAPH (LinkedIn / WhatsApp preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JobXPortal — Live Job Search" />
    <meta property="og:description" content="One search across LinkedIn, Naukri, Glassdoor and more. AI Resume Match, Interview Prep, Salary Insights — free for freshers." />
    <meta property="og:url" content="https://jobxportal.vercel.app" />
    <meta property="og:image" content="https://jobxportal.vercel.app/icon-512.svg" />
    <meta property="og:site_name" content="JobXPortal" />

    <!-- TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JobXPortal — Live Job Search" />
    <meta name="twitter:description" content="One search across all job portals. Free AI tools for freshers." />
    <meta name="twitter:image" content="https://jobxportal.vercel.app/icon-512.svg" />
    
  </head>
